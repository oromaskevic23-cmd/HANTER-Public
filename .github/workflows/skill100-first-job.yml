name: HANTER - Pinned Skill100 First Federated Job

on:
  push:
    branches: [main]
    paths:
      - 'hanter_pilot/skill100_bridge.py'
      - 'hanter_pilot/passport_v2.py'
      - 'hanter_pilot/pilot.py'
      - 'hanter_pilot/qa.py'
      - 'tools/test_skill100_bridge.py'
      - 'tools/verify_skill100_receipt.py'
      - '.github/workflows/skill100-first-job.yml'
  pull_request:
    paths:
      - 'hanter_pilot/skill100_bridge.py'
      - 'hanter_pilot/passport_v2.py'
      - 'hanter_pilot/pilot.py'
      - 'hanter_pilot/qa.py'
      - 'tools/test_skill100_bridge.py'
      - 'tools/verify_skill100_receipt.py'
      - '.github/workflows/skill100-first-job.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanter-skill100-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-first-lab:
    name: Signed ephemeral Skill100 job + separate QA / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: ${{ github.workspace }}/pinned-skill/src:${{ github.workspace }}
    steps:
      - name: Checkout original HANTER without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout pinned original IMPERIAL-Skill, not a fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: oromaskevic23-cmd/IMPERIAL-Skill
          ref: 3ae7ccc86d5e0329723ae3beb5a79ea22cdc3861
          path: pinned-skill
          persist-credentials: false
      - name: Check exact source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-skill rev-parse HEAD)" = "3ae7ccc86d5e0329723ae3beb5a79ea22cdc3861"
      - name: Set Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only existing HANTER Ed25519 verifier requirement
        run: |
          python -m pip install -r hanter_pilot/requirements-pilot.txt
          python -m pip check
      - name: Compile own integration source
        run: python -m compileall -q hanter_pilot/skill100_bridge.py tools/test_skill100_bridge.py tools/verify_skill100_receipt.py
      - name: Adversarial signed HANTER and pinned IMPERIAL-Skill checks
        run: python -m unittest discover -s tools -p 'test_skill100_bridge.py' -v
      - name: Execute one real LOCAL synthetic read-only SHA256_FILE task
        shell: bash
        run: |
          set -euo pipefail
          python -m hanter_pilot.skill100_bridge --skill-root pinned-skill --output "$RUNNER_TEMP/skill100-receipt.json"
      - name: Separate process rechecks actual local receipt and denied production
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_skill100_receipt.py --skill-root pinned-skill --receipt "$RUNNER_TEMP/skill100-receipt.json"
      - name: Fail closed if any production success is asserted
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/skill100-receipt.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["production_authorized"] is False
          assert r["real_ai_passport_issued"] is False
          assert r["owner_approval_production_verified"] is False
          assert r["external_independent_qa_verified"] is False
          assert r["production_workers_online"] == 0
          assert r["actual_local_readonly_jobs"] == 1
          print("NO_PRODUCTION_AUTHORITY_OR_UNVERIFIED_FLEET_ASSERTION")
          PY
