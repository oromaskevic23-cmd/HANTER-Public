name: HANTER — Dual Ed25519 GSC Approval Gate Integration

on:
  pull_request:
    paths:
      - "hanter_pilot/gsc_approval_verifier.py"
      - "tests/test_gsc_approval_verifier.py"
      - "tools/gsc_signed_submit_contract.py"
      - ".github/workflows/gsc-signed-approval-contract.yml"
  push:
    branches: [main]
    paths:
      - "hanter_pilot/gsc_approval_verifier.py"
      - "tests/test_gsc_approval_verifier.py"
      - "tools/gsc_signed_submit_contract.py"
      - ".github/workflows/gsc-signed-approval-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-approval-integration:
    name: Signed Owner and QA contract / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout HANTER test source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout immutable approved plugin source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: oromaskevic23-cmd/IMPERIAL-Plugins
          ref: 4a3ad344d1675e6b664a109d406d8245f93b2e0a
          path: integration/plugins
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only HANTER pinned cryptographic verifier
        run: |
          python -m pip install --disable-pip-version-check -r hanter_pilot/requirements-pilot.txt
          python -m pip check
      - name: Compile cryptographic verification and integration tests
        run: python -m py_compile hanter_pilot/gsc_approval_verifier.py tests/test_gsc_approval_verifier.py tools/gsc_signed_submit_contract.py
      - name: Verify independent signatures and reject adverse cases
        run: python -m unittest discover -s tests -p 'test_gsc_approval_verifier.py' -v
      - name: Real cross-repository signed approval and synthetic Google exchange
        env:
          PYTHONPATH: ".:integration/plugins/src"
        run: python tools/gsc_signed_submit_contract.py
      - name: Guard public release boundaries
        run: |
          test -f integration/plugins/src/imperial_plugins/search_console_submit.py
          test -f integration/plugins/src/imperial_plugins/search_console_read.py
          echo "Source contract ONLY. No Google OAuth, provider call, or production Owner key."
