name: HANTER - Pinned Owner Root Proof Gate

on:
  pull_request:
    paths:
      - 'hanter_pilot/owner_root_proof.py'
      - 'tests/test_owner_root_proof.py'
      - '.github/workflows/owner-root-proof-gate.yml'
  push:
    branches: [main]
    paths:
      - 'hanter_pilot/owner_root_proof.py'
      - 'tests/test_owner_root_proof.py'
      - '.github/workflows/owner-root-proof-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-root-proof:
    name: Owner key possession (TEST ONLY) / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install HANTER's existing offline test verifier
        run: |
          python -m pip install -r hanter_pilot/requirements-pilot.txt
          python -m pip check
      - name: Syntax and adversarial evidence
        run: |
          python -m compileall -q hanter_pilot/owner_root_proof.py tests/test_owner_root_proof.py
          python -m unittest discover -s tests -p 'test_owner_root_proof.py' -v
      - name: Confirm source is not a production issuer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hanter_pilot.owner_root_proof import production_preflight
          r=production_preflight(owner_identity_attested=True,
              passport_issuer_trusted=True,guardian_service_trusted=True,
              approval_service_trusted=True,independent_qa_trusted=True,
              sandbox_attested=True)
          assert r["worker_start_allowed"] is False
          assert r["production_authorized"] is False
          assert r["actual_signature_envelopes_checked"] is False
          print("OWNER_PROOF_FAIL_CLOSED_ONLY_NOT_DEPLOYED")
          PY
