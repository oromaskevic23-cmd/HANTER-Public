name: HANTER offline authorized NCA handoff pilot

on:
  pull_request:
    paths:
      - "hanter_pilot/**"
      - "tests/test_hanter_pilot.py"
      - ".github/workflows/hanter-offline-pilot.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out only source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Python interpreter
        run: python3 --version
      - name: Run offline authenticated handoff tests
        run: python3 -m unittest discover -s tests -p 'test_hanter_pilot.py' -v
      - name: Execute one synthetic local NCA task
        run: python3 -m hanter_pilot.pilot
